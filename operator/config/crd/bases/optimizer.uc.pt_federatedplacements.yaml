---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: federatedplacements.optimizer.uc.pt
spec:
  group: optimizer.uc.pt
  names:
    kind: FederatedPlacement
    listKind: FederatedPlacementList
    plural: federatedplacements
    singular: federatedplacement
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: FederatedPlacement is the Schema for the federatedplacements
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FederatedPlacementSpec defines the distribution strategy
              for a workload.
            properties:
              autoScaling:
                description: |-
                  AutoScaling: Parameters for the automatic creation of the
                  native HPA (e.g., min/max replicas, target CPU)
                properties:
                  maxReplicas:
                    default: 10
                    description: MaxReplicas is the upper limit for the number of
                      replicas
                    format: int32
                    minimum: 1
                    type: integer
                  minReplicas:
                    default: 1
                    description: MinReplicas is the lower limit for the number of
                      replicas
                    format: int32
                    minimum: 1
                    type: integer
                  targetCPUUtilization:
                    default: 80
                    description: TargetCPUUtilization is the average CPU utilization
                      percentage target
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                required:
                - maxReplicas
                type: object
              latencyZones:
                additionalProperties:
                  type: string
                description: |-
                  LatencyZones ($h_{ij}$): Map of traffic fraction targets per
                  geographic zone (e.g., coimbra: 0.7)
                type: object
              replicas:
                default: 1
                description: Replicas is where the HPA will write its recommendation
                  ($R_i$)
                format: int32
                type: integer
              targetWorkload:
                description: |-
                  TargetWorkload: Reference to the existing Deployment in the CMC
                  that the operator will manage
                minLength: 1
                type: string
            required:
            - autoScaling
            - latencyZones
            - targetWorkload
            type: object
          status:
            description: FederatedPlacementStatus defines the data observed for this
              workload.
            properties:
              allowedReplicas:
                description: AllowedReplicas is the number of replicas approved by
                  the global controller
                format: int32
                type: integer
              conditions:
                description: Conditions represent the current state of the placement
                  logic.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              hpaRecommendation:
                description: HPARecommendation is the last recommendation from the
                  HPA
                format: int32
                type: integer
              observedDemand:
                description: 'ObservedDemand ($R_i$): Total number of replicas requested
                  by the HPA'
                format: int32
                type: integer
              placementMap:
                additionalProperties:
                  format: int32
                  type: integer
                description: |-
                  PlacementMap ($x_{ij}$): Final calculated distribution of replicas
                  across federated clusters
                type: object
              replicas:
                format: int32
                type: integer
              resourceDemand:
                description: |-
                  ResourceDemand ($d_i$): Real resource consumption (CPU/RAM) per replica
                  discovered via Prometheus
                properties:
                  cpu:
                    anyOf:
                    - type: integer
                    - type: string
                    description: CPU is the average CPU usage discovered via Prometheus
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  memory:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Memory is the average RAM usage discovered via Prometheus
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                type: object
              selector:
                description: Selector tells the HPA which pods to monitor for CPU/RAM
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      scale:
        labelSelectorPath: .status.selector
        specReplicasPath: .spec.replicas
        statusReplicasPath: .status.replicas
      status: {}

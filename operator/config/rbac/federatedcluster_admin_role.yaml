# This rule is not used by the project federated-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over optimizer.uc.pt.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: federated-operator
    app.kubernetes.io/managed-by: kustomize
  name: federatedcluster-admin-role
rules:
- apiGroups:
  - optimizer.uc.pt
  resources:
  - federatedclusters
  verbs:
  - '*'
- apiGroups:
  - optimizer.uc.pt
  resources:
  - federatedclusters/status
  verbs:
  - get

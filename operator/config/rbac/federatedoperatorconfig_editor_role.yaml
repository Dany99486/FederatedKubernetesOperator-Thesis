# This rule is not used by the project federated-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the optimizer.uc.pt.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: federated-operator
    app.kubernetes.io/managed-by: kustomize
  name: federatedoperatorconfig-editor-role
rules:
- apiGroups:
  - optimizer.uc.pt
  resources:
  - federatedoperatorconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - optimizer.uc.pt
  resources:
  - federatedoperatorconfigs/status
  verbs:
  - get

prometheus:
  service:
    type: NodePort
    nodePort: 30090  
    prometheusSpec:
  
    # Scrape configuration for the remote cluster
    additionalScrapeConfigs:
      - job_name: 'opencost-member-cluster'
        static_configs:
          - targets: ['10.3.1.38:30560'] # Member cluster IP
        honor_labels: true               # Preserves original node labels
        scrape_interval: 15s             # High frequency for fast heuristic reaction
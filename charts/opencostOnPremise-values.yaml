opencost:
  customPricing:
    enabled: true
    costModel:
      description: "Master's Thesis Lab Pricing"
      cpu: "0.025"     # Cost in € per vCPU/hour
      ram: "0.012"     # Cost in € per GB/hour
      storage: "0.005"
  metrics:
    service:
      type: NodePort   # Allows CMC to access easily via IP
      port: 9003